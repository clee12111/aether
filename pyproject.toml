[project]
name = "aether"
version = "0.1.0"
description = "Workflow Reasoning Engine"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "pydantic",
    "pydantic-settings",
    "chromadb",
    "sentence-transformers",
    "rank-bm25",
    "flashrank",
    "streamlit",
    "duckdb",
    "pdfplumber",
    "openpyxl",
    "pandas",
    "rich",
    "pytest",
    "python-dotenv",
    "pytest-timeout>=2.4.0",
    "camelot-py[cv]>=1.0.9",
    "pymupdf>=1.27.2.3",
    "vl-convert-python>=1.9.0.post1",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aether*"]
