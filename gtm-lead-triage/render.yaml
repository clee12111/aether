services:
  - type: web
    name: gtm-triage-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: GTM_PROVIDER
        value: openai
      - key: GTM_API_KEYS
        sync: false
      - key: CRM_BACKEND
        value: sqlite
      - key: ENRICHMENT_PROVIDER
        value: pdl
      - key: PDL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
    healthCheckPath: /ready
