<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title>Aether behavior on answerable vs unanswerable goals</title>
<desc>Two real runs side by side. Left: a goal the document supports — the engine queries, builds a grounded chart, and passes. Right: a goal the document cannot support — the engine searches, finds the data absent, and returns a partial result without fabricating.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="40" y="20" width="270" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="175" y="46" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Goal the document supports</text>
<text x="175" y="66" text-anchor="middle" font-size="12" fill="#5F5E5A">"profit by segment" · 700-row CSV</text>
<rect x="370" y="20" width="270" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="505" y="46" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Goal it cannot support</text>
<text x="505" y="66" text-anchor="middle" font-size="12" fill="#5F5E5A">"5-year trend" · 2-year statement</text>
<rect x="40" y="120" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="146" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Query the data</text>
<text x="175" y="165" text-anchor="middle" font-size="12" fill="#0F6E56">SQL aggregation over 700 rows</text>
<line x1="175" y1="80" x2="175" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="120" width="270" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="505" y="146" text-anchor="middle" font-size="14" font-weight="500" fill="#412402">Search the tables</text>
<text x="505" y="165" text-anchor="middle" font-size="12" fill="#854F0B">Looks for 5 years, finds 2</text>
<line x1="505" y1="80" x2="505" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="216" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="242" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Build grounded chart</text>
<text x="175" y="261" text-anchor="middle" font-size="12" fill="#0F6E56">Values copied from SQL result</text>
<line x1="175" y1="176" x2="175" y2="214" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="216" width="270" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="505" y="242" text-anchor="middle" font-size="14" font-weight="500" fill="#412402">Decline to fill the gap</text>
<text x="505" y="261" text-anchor="middle" font-size="12" fill="#854F0B">Does not invent 3 missing years</text>
<line x1="505" y1="176" x2="505" y2="214" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="312" width="270" height="64" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="175" y="338" text-anchor="middle" font-size="14" font-weight="500" fill="#173404">PASS</text>
<text x="175" y="358" text-anchor="middle" font-size="12" fill="#3B6D11">Totals matched independent check</text>
<line x1="175" y1="272" x2="175" y2="310" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="312" width="270" height="64" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="505" y="338" text-anchor="middle" font-size="14" font-weight="500" fill="#501313">PARTIAL — flagged, not faked</text>
<text x="505" y="358" text-anchor="middle" font-size="12" fill="#A32D2D">"rows include 2002 and 2001 only"</text>
<line x1="505" y1="272" x2="505" y2="310" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="408" text-anchor="middle" font-size="12" fill="#5F5E5A">Same engine. It answers when it can and refuses when it can't — both are real, verified runs.</text>
</svg>
