<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title>Finance document path</title>
<desc>A financial statement PDF has its tables extracted by Camelot, is loaded and queried with SQL, and rendered as a grounded chart whose values trace back to the source cells.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="14" y="60" width="120" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="74" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Statement PDF</text>
<text x="74" y="102" text-anchor="middle" font-size="12" fill="#5F5E5A">Income statement</text>
<rect x="170" y="60" width="120" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="230" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Camelot</text>
<text x="230" y="102" text-anchor="middle" font-size="12" fill="#993C1D">Extract tables</text>
<line x1="134" y1="92" x2="168" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="326" y="60" width="120" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="386" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">load_data</text>
<text x="386" y="102" text-anchor="middle" font-size="12" fill="#0F6E56">Table manifest</text>
<line x1="290" y1="92" x2="324" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="482" y="60" width="80" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="522" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">run_sql</text>
<text x="522" y="102" text-anchor="middle" font-size="12" fill="#0F6E56">Read row</text>
<line x1="446" y1="92" x2="480" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="598" y="60" width="72" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="634" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Chart</text>
<text x="634" y="102" text-anchor="middle" font-size="12" fill="#185FA5">Grounded</text>
<line x1="562" y1="92" x2="596" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="164" text-anchor="middle" font-size="12" fill="#5F5E5A">Every charted value traces back to a source cell — gross profit 364,672, exact</text>
</svg>
