<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title>CSV aggregation path</title>
<desc>A 700-row financial CSV is loaded and cleaned, queried with a SQL group-by-and-sum, and rendered as a grounded bar chart whose values match an independent computation.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="20" y="60" width="140" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="90" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">700-row CSV</text>
<text x="90" y="102" text-anchor="middle" font-size="12" fill="#5F5E5A">$, commas, (negatives)</text>
<rect x="196" y="60" width="140" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="266" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">load_data</text>
<text x="266" y="102" text-anchor="middle" font-size="12" fill="#0F6E56">Coerce to numeric</text>
<line x1="160" y1="92" x2="194" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="372" y="60" width="140" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="442" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">run_sql</text>
<text x="442" y="102" text-anchor="middle" font-size="12" fill="#0F6E56">GROUP BY, SUM</text>
<line x1="336" y1="92" x2="370" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="548" y="60" width="120" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="608" y="84" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">render_visual</text>
<text x="608" y="102" text-anchor="middle" font-size="12" fill="#185FA5">Grounded chart</text>
<line x1="512" y1="92" x2="546" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="344" y="164" text-anchor="middle" font-size="12" fill="#5F5E5A">Segment totals matched an independent pandas computation exactly</text>
</svg>
